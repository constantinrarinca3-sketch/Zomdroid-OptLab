name: Android CI

on:
  workflow_dispatch: {}
  
  pull_request:
    branches: [ gamepad-support-patch ]
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare and test OPT-LAB agent bundle
        run: |
          ./tools/build-optlab-agent.sh
          ./tools/test-optlab-agent-source.sh
          ./tools/test-pathfinding-native-payload.sh
          ./tools/test-native-modules-source.sh
          ./tools/test-native-modules-preferences.sh
          ./tools/test-native-modules-ui-source.sh
          ./tools/test-mobilegl-default-payload.sh
          ./tools/test-cp1-proof-validator.sh

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/**/*.apk
