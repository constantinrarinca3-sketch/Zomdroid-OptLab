name: Build ZomDroid OptLab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 and NDK r27d
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build side-by-side debug APK
        run: ./gradlew :app:assembleSideBySideDebug --stacktrace

      - name: Show produced APKs
        run: find app/build/outputs -type f -name '*.apk' -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZomDroid-OptLab-MGLPZ2-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
