name: Zomdroid (Android Studio Build)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'master'
        type: choice
        options:
        - master
        - patch146
        
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare and test OPT-LAB agent bundle
      run: |
        ./tools/build-optlab-agent.sh
        ./tools/test-optlab-agent-source.sh
        ./tools/test-pathfinding-native-payload.sh
        ./tools/test-popman-native-source.sh
        ./tools/test-native-modules-source.sh
        ./tools/test-native-modules-preferences.sh
        ./tools/test-native-modules-ui-source.sh
        ./tools/test-optlab-preferences-independence.sh
        ./tools/test-mobilegl-default-payload.sh
        ./tools/test-jassimp-direct.sh
        ./tools/test-cp1-proof-validator.sh

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.3.13750724"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> $GITHUB_ENV

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk-${{ github.event.inputs.branch }}
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk-${{ github.event.inputs.branch }}
        path: app/build/outputs/apk/release/*.apk

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare and test OPT-LAB agent bundle
      run: |
        ./tools/build-optlab-agent.sh
        ./tools/test-optlab-agent-source.sh
        ./tools/test-pathfinding-native-payload.sh
        ./tools/test-popman-native-source.sh
        ./tools/test-native-modules-source.sh
        ./tools/test-native-modules-preferences.sh
        ./tools/test-native-modules-ui-source.sh
        ./tools/test-optlab-preferences-independence.sh
        ./tools/test-mobilegl-default-payload.sh
        ./tools/test-jassimp-direct.sh
        ./tools/test-cp1-proof-validator.sh

    - name: Run unit tests
      run: ./gradlew test

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ github.event.inputs.branch }}
        path: app/build/test-results/
